<!-- Root SVG container that spans 100% of the width and height of its parent element 
-->

<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">

  <!-- <defs> holds reusable definitions that aren't rendered directly until referenced 
  -->
  <defs>

    <!-- Minor Pattern: A 10x10 pixel tile that repeats across the canvas 
    -->
    <pattern id="minor" width="10" height="10" patternUnits="userSpaceOnUse">
      <!-- Draws a light gray 1x1 pixel dot at the top-left of every 10x10 area 
      -->
      <rect x="0" y="0" width="1" height="1" fill="#DDDDDD" />
    </pattern>
    
    <!-- Major Pattern: A 100x100 pixel tile that repeats across the canvas 
    -->
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Draws a darker gray 2x2 pixel dot at the top-left of every 100x100 area 
      -->
      <rect x="0" y="0" width="1" height="1" fill="#888888" />
    </pattern>
    
  </defs>

  <!-- Background layer
  -->
  <rect width="100%" height="100%" fill="url(#minor)" />
  
  <!-- Foreground layer
  -->
  <rect width="100%" height="100%" fill="url(#major)" />

</svg>